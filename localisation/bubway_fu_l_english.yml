ENG_ici_filling_factories:0 "Contract with Imperial Chemical"
ENG_ici_filling_factories_desc:0 "Imperial Chemical has the infrastructure necessary to produce fillings for artillery. We should contract with them and others to meet our production quotas."
ENG_imperial_trade_preference:0 "Imperial Trade Preference"
ENG_imperial_trade_preference_desc:0 "By prioritizing trade within the Imperial Realm and placing tariffs on goods coming from outside. We can keep more wealth within The Empire."
ENG_borrow_americans:0 "Borrow from the Americans"
ENG_borrow_americans_desc:0 "Simple lend and lease is still not enough. We need more loans to continue domestic re-armament."
ENG_royal_small_arms_factory:0 "Royal Small Arms Factory Enfield"
ENG_royal_small_arms_factory_desc:0 "RSAF Enfield in London will simply not be enough. We should expand the factory grounds and perhaps expand some of the facilities at a safer location."
ENG_operation_fish_focus:0 "Operation Fish (Factory Evac)"
ENG_operation_fish_focus_desc:0 "For the past several years Operation code name Fish has been underway, quietly moving our gold reserves to a safe location. Its time to use that gold to relocate our War Machine. This wont be the end. We vow to return one day."
ENG_operation_iran:0 "Operation Countenance"
ENG_operation_iran_desc:0 "We simply cannot allow the Shah to supply oil to the Huns War Machine. Further more securing Peria will allow a safe supply route to the Soviet Union. A Joint Invasion Plan has been Drawn up."
ENG_war_cab:0 "Churchill's War Ministry"
ENG_war_cab_desc:0 "Neville Chamberlain has resigned. Winston Churchill has been appointed prime minister and has formed a unity coalition government."

ENG_army_rearm:0 "Army Rearmament"
ENG_army_rearm_desc:0 "The Royal Navy has had generious funding for a decade leaving the army in a sad state. With a shaodw over Europe once more. Its time to recalibrate our priorities."
ENG_bovington_tank_school:0 "Bovington Royal Tank School"
ENG_bovington_tank_school_desc:0 "The Empire lacks a serious tank force. Revingorating the Royal Tank School at Camp Bovington will be a step in the right direction."
ENG_infantry_tanks:0 "Infantry Tanks"
ENG_infantry_tanks_desc:0 "Heavy armor tanks will provide our infantry sections adequate close fire support for the battles to come."
ENG_royal_tank_regi:0 "Royal Tank Regiments"
ENG_royal_tank_regi_desc:0 "Lighter tanks will be needed to take advantage of gaps in enemy lines. The Royal Tank Regiments will lead the way."
ENG_mech_army:0 "The Universal Carrier"
ENG_mech_army_desc:0  "It is clear mechanisation is the future. We need to standardize our Mechanised equipment for mass production. The lads are calling it The Universal Carrier."
ENG_ta_reform:0 "Reform the Territorial Force" 
ENG_ta_reform_desc:0 "The Territorial Force in its currernt state lacks the size ,training and equipment. Major reforms and expansion of the force will be needed to meet the needs of a future conflict"
ENG_forward_officers:0 "Forward Observation Officers"
ENG_forward_officers_desc:0 "Instead of relying on infantryman radio operators to request fire support. Royal Artillery officers will serve at the front, observe the battlefield and proactively call out enemny targets and postions in need of a good ground pound." 
ENG_yeomanry:0 "Evolution of the Yeomanry"
ENG_yeomanry_desc:0 "Calvary Regiments still have a use on the battlefield. We just need to get a little more creative."
ENG_royal_service_company:0 "Royal Army Service Corps"
ENG_royal_service_company_desc:0 "Far from the days we are of the Royal Waggon Corps. Hit the speed governor Mr.Biggles."
